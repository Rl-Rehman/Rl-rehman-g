<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort() Example</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
    $(document).ready(function () {
//     your array
     var myArray = ["Apple", "Banana", "Orange", "Grapes", "Kiwi" ];
    
// Use pop () to remove the last element from the array
     myArray.sort();

// Display the updated array and the removed element
     $.each(myArray, function (index, value) {
        $("#result").append("<li>" + value + "<li>");
     }); 
      });
</script>
</head>
<body>
    <ul id = "result"></ul>
</body>
</html>
