<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Pre Loader Website</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

	<style type="text/css">
		.preloader {
			position: absolute;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;
			background-color: white;
		}

		.abc {
			position: relative;
			left: 40%;
			top: 40%;
			background-image: url("https://www.freepnglogos.com/uploads/apple-logo-png/apple-logo-png-dallas-shootings-don-add-are-speech-zones-used-4.png");
			background-size: cover;
			height: 250px;
			width: 250px;
			animation-name: test;
			animation-duration: 1s;
			animation-iteration-count: infinite;

		}

		@keyframes test {
			from {
				transform: scale(1.5);
			}

			to {
				transform: scale(2);
			}
		}
	</style>

</head>

<body>

	<div class="preloader">
		<div class="abc"></div>
	</div>
	<h1>Hello My Loader Website</h1>

	<!-- here is 4000 mean = 4 second -->

	<script type="text/javascript">
		$(window).on("load", function () {
			$(".abc").delay(4000).fadeOut();
			$(".preloader").delay(4000).fadeOut("slow");
		})
	</script>
</body>

</html>
