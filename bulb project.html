<!DOCTYPE html>
<html lang="en">
<head>

    <title>BULB</title>
</head>
<body>
    <h4>Bulb On  Off On Click Using Function</h4>

<img id="lightBulb" src="d:\Picture\bulb_off.jpg" onclick="ToggleLightBulb()">


<script type="text/javascript">

function ToggleLightBulb(){
  var Bulb = document.getElementById("lightBulb");

  if (bulb.src.endswith(bulb_off.jpg)) {
    bulb.src = "d:\Picture\bulb_on.jpg";
  } else {
    bulb.src = "d:\Picture\bulb_off.jpg";
  }
}
</script>
    
</body>
