<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars loop</title>
</head>
<body>
    <script>

//  <!-- printing stars in increment -->
document.write("<h2>Incerment</h2>");
for (var i = 1; i <= 15; i++)  {

for (var j = 0; j < i; j++) {
    document.write("**");
}    
    document.write("<br>");
}


// Adding a heading for decrement
document.write("<h2>Decrement</h2>");

//  printing stars in decrement
for (var i = 10; i >= 1; i--)  {

for (var j = 0; j < i; j++) {
    document.write("*");
}    
    document.write("<br>");
}

    </script>
    
</body>
</html>
