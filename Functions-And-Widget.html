<!-- foreach -->

<!DOCTYPE html>
<html>

<head>
  <title></title>
</head>

<body>

  <script type="text/javascript">


    var myArray = [1, 2, 3, 4, 5];
    myArray.forEach(function (element, index, array) {
      document.write("Element at index " + index + ": " + element);
      document.write("Full array:", array);
    });


  </script>

</body>

</html>
