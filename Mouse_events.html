<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>On mouse click</title>
</head>
<body>
    <h1>Html Dom Events</h1>
    <p>The oneclick event trigger a function when a element is clicked om.</p><br>
    <h2>The Oneclick Events</h2>
    <p>Click to trigger a function that will output "Hello World"</p>

    <button oneclick="myFunction()">click me </button>

    <p id ="demo"></p>

     <script>
      function myFunction() {
        document.getElementById("demo").innerHTML = "" 

        
      }
     </script>  
</body>
</html>
